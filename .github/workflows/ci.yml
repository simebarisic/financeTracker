name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: financetracker
          POSTGRES_USER: financetracker
          POSTGRES_PASSWORD: financetracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U financetracker"
          --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build jar
        working-directory: backend
        run: mvn -B clean package -DskipTests

      # No unit tests exist yet, so this boots the real jar against a real Postgres and
      # exercises the main read paths through auth — the same paths that broke in practice
      # (a bad enum comparison, a lazy-loading proxy read outside its session). Cheap
      # insurance against those classes of bug recurring.
      - name: Smoke test the built jar
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/financetracker
          SPRING_DATASOURCE_USERNAME: financetracker
          SPRING_DATASOURCE_PASSWORD: financetracker
          JWT_SECRET: ci-smoke-test-secret-please-ignore-32-chars-min
          APP_ADMIN_USERNAME: ci-admin
          APP_ADMIN_PASSWORD: ci-admin-password
        run: |
          set -e
          java -jar target/finance-tracker-backend.jar &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT

          echo "Waiting for the app to become healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Up after ${i} attempt(s)."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Backend never became healthy"; exit 1
            fi
            sleep 2
          done

          TOKEN=$(curl -sf -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-admin","password":"ci-admin-password"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")

          echo "Checking categories, transactions and dashboard endpoints..."
          curl -sf http://localhost:8080/api/categories -H "Authorization: Bearer $TOKEN" > /dev/null
          curl -sf "http://localhost:8080/api/transactions?year=2026&month=1" -H "Authorization: Bearer $TOKEN" > /dev/null
          curl -sf "http://localhost:8080/api/dashboard/summary?year=2026&month=1" -H "Authorization: Bearer $TOKEN" > /dev/null
          curl -sf "http://localhost:8080/api/dashboard/trend?months=3" -H "Authorization: Bearer $TOKEN" > /dev/null
          echo "Smoke test passed."

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - working-directory: frontend
        run: npm ci

      - working-directory: frontend
        run: npm run build

  docker-publish:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta-backend
        with:
          images: ghcr.io/${{ github.repository }}-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/metadata-action@v5
        id: meta-frontend
        with:
          images: ghcr.io/${{ github.repository }}-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # GitOps: upiše novi tag u apps-config (apps/finance-tracker/envs/dev), a Argo CD ga deploya na DEV.
  # Pristup apps-configu: GitHub App (varijabla CONFIG_APP_CLIENT_ID + secret CONFIG_APP_PRIVATE_KEY).
  # Dok varijabla ne postoji, job se preskače.
  update-dev:
    name: Novi tag na DEV (apps-config)
    needs: docker-publish
    if: github.ref == 'refs/heads/main' && vars.CONFIG_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: apps-config-finance-tracker-dev
      cancel-in-progress: false
    steps:
      - name: Token za apps-config (GitHub App, vrijedi 1 h)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CONFIG_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONFIG_APP_PRIVATE_KEY }}
          owner: simebarisic
          repositories: apps-config

      - name: Checkout apps-config
        uses: actions/checkout@v7
        with:
          repository: simebarisic/apps-config
          token: ${{ steps.app-token.outputs.token }}

      - name: Upiši tag i pushaj
        run: |
          TAG="sha-${GITHUB_SHA::7}"   # isti tag koji je build objavio na GHCR
          ./scripts/set-tag.sh finance-tracker dev "$TAG"
          if git diff --quiet; then echo "DEV je već na $TAG"; exit 0; fi
          git config user.name "finance-tracker-ci"
          git config user.email "finance-tracker-ci@users.noreply.github.com"
          git commit -qam "finance-tracker: DEV -> $TAG ($GITHUB_SHA)"
          # Ako je netko u međuvremenu pushao u apps-config, povuci i pokušaj ponovno.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
