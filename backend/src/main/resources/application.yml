server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: finance-tracker-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/financetracker}
    username: ${SPRING_DATASOURCE_USERNAME:financetracker}
    password: ${SPRING_DATASOURCE_PASSWORD:financetracker}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-please-override-in-production-min-32-bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:changeme123}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.financetracker: INFO
