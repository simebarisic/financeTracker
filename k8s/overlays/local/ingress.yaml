# Ingress preko Traefika (ugrađen u k3s/k3d). TLS certifikat u secretu
# "finance-tracker-tls" izdaje cert-manager prema certificate.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finance-tracker
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - finance.localtest.me
      secretName: finance-tracker-tls
  rules:
    - host: finance.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
