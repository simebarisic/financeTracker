# Zajednička osnova. Overlaye (k8s/overlays/*) postavljaju namespace, image
# tagove, Ingress/TLS i secrete. Base se NE deploya sam.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: finance-tracker
    includeSelectors: false

resources:
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - backup.yaml

# Ne-tajne postavke. Kustomize dodaje hash u ime ConfigMapa, pa svaka promjena
# automatski pokreće rolling restart Deploymenta koji ga koriste.
configMapGenerator:
  - name: finance-tracker-config
    literals:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/financetracker
      - SPRING_DATASOURCE_USERNAME=financetracker
      - JWT_EXPIRATION_MINUTES=1440
      - APP_ADMIN_USERNAME=admin
      - APP_CORS_ALLOWED_ORIGINS=http://localhost:3000
